      # ----- namespace -----
apiVersion: v1
kind: Namespace
metadata:
  name: jerney-ns

    #        *** FRONTEND manifests file ***

      # ----- frontend deployment ----
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jerney-frontend-deployment
  namespace: jerney-ns
  labels:
    app: jerney-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jerney-frontend
  template:
    metadata:
      labels:
        app: jerney-frontend
    spec:
      automountServiceAccountToken: false
      tolerations:
        - key: "karpenter.sh/disrupted"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: frontend
          image: rutvikg/frontend
          imagePullPolicy: Always 
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false # Nginx needs write for cache/pid
            runAsNonRoot: true
            runAsUser: 101 # nginx user UID in alpine
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5



      # ------ frontend service ------
apiVersion: v1
kind: Service
metadata:
  name: jerney-frontend-service
  namespace: jerney-ns
  labels:
    app: jerney-frontend
spec:
  type: ClusterIP
  selector:
    app: jerney-frontend
  ports:
    - port: 80
      targetPort: 80


        #            *** Backend manifests files ***
      
# ----- deployment -----
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jerney-backend-deployment
  namespace: jerney-ns
  labels:
    app: jerney-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jerney-backend
  template:
    metadata:
      labels:
        app: jerney-backend
    spec:
      automountServiceAccountToken: false
      tolerations:
        - key: "karpenter.sh/disrupted"
          operator: "Exists"
          effect: "NoSchedule"
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for jerney-postgres-service :5432..."
              until nc -z jerney-postgres-service 5432; do
                echo "DB not ready, retrying in 3s..."
                sleep 3
              done
              echo "DB is ready!"
      containers:
        - name: backend
          image: rutvikg/backend
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              value: "5000"
            - name: DB_HOST
              value: "jerney-postgres-service"
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: jerney-db-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jerney-db-secret
                  key: POSTGRES_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: jerney-db-secret
                  key: POSTGRES_DB

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          # Security context
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3


# ----- service -----
apiVersion: v1
kind: Service
metadata:
  name: jerney-backend-service
  namespace: jerney-ns
  labels:
    app: jerney-backend
spec:
  type: ClusterIP
  selector:
    app: jerney-backend
  ports:
    - port: 5000
      targetPort: 5000


# ---- NetworkPolicy: Backend accepts traffic from Frontend only ----

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jerney-backend-allow-frontend-only
  namespace: jerney-ns
spec:
  podSelector:
    matchLabels:
      app: jerney-backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: jerney-frontend
      ports:
        - port: 5000


          #   *** database manifests files ***

# ---- database secret -----
# In production, use External Secrets Operator or Sealed Secrets.
# This is base64 encoded for demo purposes.
# echo -n 'postgres' | base64 → cG9zdGdyZXM=
# echo -n 'postgres' | base64 → cG9zdGdyZXM=
# echo -n 'db' | base64 → amVybmV5X2Ri

apiVersion: v1
kind: Secret
metadata:
  name: jerney-db-secret
  namespace: jerney-ns
  labels:
    app: jerney
type: Opaque
data:
  POSTGRES_USER: cG9zdGdyZXM=
  POSTGRES_PASSWORD: cG9zdGdyZXM=
  POSTGRES_DB: ZGI=

    # ---- EBS StorageClass (gp3) ----
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: jerney-ebs-sc
provisioner: ebs.csi.eks.amazonaws.com
parameters:
  type: gp3
  encrypted: "true"
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true


# ---- PersistentVolumeClaim for PostgreSQL (EBS) ----
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jerney-db-pvc
  namespace: jerney-ns
  labels:
    app: jerney
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: jerney-ebs-sc
  resources:
    requests:
      storage: 10Gi


# ---- postgres deployment ----
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jerney-postgres-deployment
  namespace: jerney-ns
  labels:
    app: jerney-db
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jerney-db
  template:
    metadata:
      labels:
        app: jerney-db
    spec:
      # Security: don't automount service account token (DB doesn't need K8s API)
      automountServiceAccountToken: false
      tolerations:
          - key: "karpenter.sh/disrupted"
            operator: "Exists"
            effect: "NoSchedule"
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: Always
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: jerney-db-secret
          volumeMounts:
            - name: db-storage
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # Security context
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false # Postgres needs write access
            runAsNonRoot: false            # Postgres image runs initdb as root then drops
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "db"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
      
      volumes:
        - name: db-storage
          persistentVolumeClaim:
            claimName: jerney-db-pvc


# ---- postgres service -----
apiVersion: v1
kind: Service
metadata:
  name: jerney-postgres-service
  namespace: jerney-ns
  labels:
    app: jerney-db
spec:
  type: ClusterIP
  selector:
      app: jerney-db
  ports:
    - port: 5432
      targetPort: 5432


